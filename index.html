<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>姜乐颖-coco-resume</title>
<meta name="description" content="姜乐颖 coco 的椰子小岛——新媒体内容创作者的个人作品集">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2e4bd; --bg-deep:#ecd9a4;
  --ink:#43281a; --ink-rgb:67,40,26; --ink-soft:rgba(var(--ink-rgb),.62);
  --accent:#f5a300; --accent-rgb:245,163,0; --accent-deep:#e07f00;
  --leaf:#5f9e56; --sea:#5cb8ae;
  --card:#fffdf4; --line:rgba(var(--ink-rgb),.16);
  --shadow:0 14px 34px rgba(var(--ink-rgb),.14);
  --cream:#efe3c0; --cream-rgb:239,227,192;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);
  font:400 14px/1.9 "Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
a{color:inherit}img{max-width:100%;display:block}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}

#cur{position:fixed;z-index:9999;top:-11px;left:-11px;width:22px;height:22px;pointer-events:none;
  font-size:20px;line-height:22px;text-align:center;filter:drop-shadow(0 2px 2px rgba(var(--ink-rgb),.3));display:block}
@media(pointer:coarse){#cur{display:none}}
.paw-pop{position:fixed;z-index:9998;pointer-events:none;font-size:16px;animation:pawPop .8s ease-out forwards}
@keyframes pawPop{0%{opacity:.9;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-34px) scale(1.15) rotate(14deg)}}

#prog{position:fixed;top:0;left:0;right:0;height:4px;z-index:997;pointer-events:none;opacity:0;transition:opacity .3s}
body.detail-open #prog{opacity:1}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-deep))}

/* 顶栏 */
.gheader{position:fixed;top:0;left:0;right:0;z-index:940;display:flex;align-items:center;gap:14px;padding:14px 24px;pointer-events:none}
.gheader .logo{display:flex;align-items:center;gap:9px;pointer-events:auto}
.gheader .logo .dot{width:11px;height:11px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
.gheader .logo b{font:900 16px/1 "Zen Maru Gothic","Noto Sans SC"}
.gheader .logo small{font:700 9.5px/1 "Zen Maru Gothic";letter-spacing:.28em;color:var(--ink-soft)}
.nav-pill{margin-left:auto;pointer-events:auto;display:flex;gap:2px;background:#fff;border-radius:99px;
  padding:5px 8px;box-shadow:0 8px 22px rgba(var(--ink-rgb),.12)}
.nav-pill a{text-decoration:none;font-size:12.5px;font-weight:700;color:var(--ink);
  padding:6px 13px;border-radius:99px;transition:.2s;white-space:nowrap}
.nav-pill a:hover{background:var(--accent);color:#fff}
.menu-button{margin-left:auto;pointer-events:auto;display:none;align-items:center;gap:9px;
  background:#fff;border-radius:99px;padding:11px 20px;font:700 12px/1 "Zen Maru Gothic";
  letter-spacing:.24em;box-shadow:0 8px 22px rgba(var(--ink-rgb),.12);transition:.25s}
.menu-button:hover{background:var(--accent);color:#fff}
.menu-button .bars{display:grid;gap:3px}
.menu-button .bars i{width:15px;height:2px;background:currentColor;border-radius:2px}
@media(max-width:1080px){.nav-pill{display:none}.menu-button{display:flex}}

.gmenu{position:fixed;inset:0;z-index:960;background:var(--ink);color:#fff;
  transform:translateY(-102%);transition:transform .6s cubic-bezier(.22,.8,.25,1);
  display:flex;flex-direction:column;justify-content:center;padding:90px 8vw 40px;overflow:auto}
.gmenu.open{transform:none}
.gmenu-close{position:absolute;top:16px;right:24px;color:#fff;font:700 12px/1 "Zen Maru Gothic";
  letter-spacing:.24em;background:rgba(255,255,255,.12);border-radius:99px;padding:12px 22px}
.gmenu-close:hover{background:var(--accent-deep)}
.gmenu nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 34px;max-width:900px}
.gmenu nav a{display:flex;align-items:baseline;gap:14px;text-decoration:none;padding:10px 6px;
  border-bottom:1px dashed rgba(255,255,255,.18);transition:.25s}
.gmenu nav a .en{font:900 clamp(22px,3.4vw,34px)/1.2 "Zen Maru Gothic";transition:.25s}
.gmenu nav a .zh{font-size:12.5px;color:rgba(255,255,255,.62);letter-spacing:.14em}
.gmenu nav a:hover .en{color:var(--accent);transform:translateX(8px)}
.gmenu-foot{margin-top:44px;font-size:12px;color:rgba(255,255,255,.55)}
.gmenu-foot b{color:rgba(255,255,255,.85)}

/* ===== 3D 场景 ===== */
.scene{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(180deg,#8fd0e8 0%,#c9e6ec 22%,#eaf2d8 42%,var(--bg) 62%,var(--bg-deep) 100%);
  transition:transform .65s cubic-bezier(.3,.7,.3,1),opacity .55s ease,filter .65s}
body.detail-open .scene{transform:scale(1.12);opacity:0;filter:blur(4px);pointer-events:none}
#stage{position:absolute;inset:0}
#stage canvas{display:block;cursor:grab}
#stage canvas.dragging{cursor:grabbing}
#stage canvas.hover-b{cursor:pointer}
.drag-hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:15;
  font-size:11.5px;letter-spacing:.18em;color:var(--ink-soft);background:rgba(255,253,244,.8);
  border:1.5px dashed var(--line);border-radius:99px;padding:6px 18px;pointer-events:none;transition:opacity .6s}
.drag-hint.hide{opacity:0}
.day-btn{position:fixed;bottom:24px;right:24px;z-index:960;width:54px;height:54px;border-radius:50%;
  background:var(--card);box-shadow:0 8px 22px rgba(var(--ink-rgb),.22);font-size:25px;line-height:54px;
  text-align:center;transition:.3s;border:1.5px solid var(--line)}
.day-btn:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 14px 32px rgba(var(--ink-rgb),.3)}
.lang-btn{position:fixed;bottom:90px;right:24px;z-index:960;width:54px;height:54px;border-radius:50%;
  background:var(--card);box-shadow:0 8px 22px rgba(var(--ink-rgb),.22);font:800 15px/54px "Zen Maru Gothic";
  text-align:center;color:var(--ink);transition:.3s;border:1.5px solid var(--line)}
.lang-btn:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 14px 32px rgba(var(--ink-rgb),.3)}
.music-btn{position:fixed;bottom:156px;right:24px;z-index:960;width:54px;height:54px;border-radius:50%;
  background:var(--card);box-shadow:0 8px 22px rgba(var(--ink-rgb),.22);font-size:23px;line-height:54px;
  text-align:center;transition:.3s;border:1.5px solid var(--line)}
.music-btn:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 14px 32px rgba(var(--ink-rgb),.3)}
.music-btn.on{border-color:var(--accent);animation:musicPulse 2.2s ease-in-out infinite}
@keyframes musicPulse{0%,100%{box-shadow:0 8px 22px rgba(var(--ink-rgb),.22)}50%{box-shadow:0 8px 26px rgba(var(--accent-rgb),.5)}}
@media(pointer:coarse){.music-btn{bottom:128px;right:16px;width:46px;height:46px;line-height:46px;font-size:19px}}
.music-panel{position:fixed;bottom:222px;right:18px;z-index:960;width:150px;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  box-shadow:0 8px 22px rgba(var(--ink-rgb),.22);padding:11px 13px;
  display:flex;align-items:center;gap:9px;opacity:0;pointer-events:none;
  transform:translateY(8px);transition:opacity .25s,transform .25s}
.music-panel.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.music-panel .vol-icon{font-size:16px;line-height:1}
.music-panel input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;
  background:rgba(var(--ink-rgb),.18);outline:none;cursor:pointer}
.music-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;
  border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.music-panel input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid #fff}
@media(pointer:coarse){.music-panel{bottom:186px;right:10px;width:132px}}
@media(pointer:coarse){.lang-btn{bottom:72px;right:16px;width:46px;height:46px;line-height:46px;font-size:13px}}
@media(pointer:coarse){.day-btn{bottom:16px;right:16px;width:46px;height:46px;line-height:46px;font-size:21px}}
/* 建筑 hover 浮空标签 */
.hover-label{position:fixed;z-index:970;pointer-events:none;transform:translate(-50%,-150%);
  background:var(--ink);color:var(--cream);font:900 13px/1 "Zen Maru Gothic","Noto Sans SC";
  letter-spacing:.16em;text-transform:uppercase;padding:9px 15px;border-radius:11px;
  box-shadow:0 10px 24px rgba(var(--ink-rgb),.32);opacity:0;white-space:nowrap;
  transition:opacity .12s ease}
.hover-label.on{opacity:1}
.hover-label::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}

/* 信息卡 */
.info-card{position:absolute;left:4vw;top:50%;transform:translateY(-58%);z-index:20;
  width:270px;background:#fff;border-radius:18px;padding:26px 26px 24px;
  box-shadow:0 18px 44px rgba(var(--ink-rgb),.16)}
.info-card .hello{font:700 10.5px/1 "Zen Maru Gothic";letter-spacing:.3em;color:var(--ink-soft);text-transform:uppercase}
.info-card .cat{margin-top:12px;font:900 19px/1.4 "Zen Maru Gothic","Noto Sans SC";color:var(--accent-deep)}
.info-card .cat-en{font:700 10.5px/1 "Zen Maru Gothic";letter-spacing:.32em;color:var(--ink-soft);text-transform:uppercase;margin-top:2px}
.info-card .tag{margin-top:14px;font-weight:900;font-size:16.5px;line-height:1.7;letter-spacing:.02em}
.info-card .desc{margin-top:8px;font-size:12px;line-height:1.95;color:var(--ink-soft)}
.info-card .more-btn{margin-top:16px;display:inline-flex;align-items:center;gap:10px;
  background:var(--accent);color:#fff;border-radius:99px;padding:11px 26px;
  font:700 12px/1 "Zen Maru Gothic";letter-spacing:.3em;text-decoration:none;transition:.25s}
.info-card .more-btn:hover{background:var(--accent-deep);transform:translateY(-2px)}
.info-card .card-dot{position:absolute;top:14px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--ink);opacity:.85}
@media(max-width:1080px){
  .info-card{left:14px;right:14px;width:auto;top:auto;bottom:12px;transform:none;
    padding:16px 20px;border-radius:16px;display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:center}
  .info-card .hello,.info-card .cat-en,.info-card .desc,.info-card .card-dot{display:none}
  .info-card .cat{margin:0;font-size:16px;grid-row:1}
  .info-card .tag{margin:0;font-size:12px;font-weight:700;grid-row:2}
  .info-card .more-btn{margin:0;grid-row:1/3;padding:10px 18px}
}

/* 详情 */
.detail{position:fixed;inset:0;z-index:900;background:var(--bg);overflow-y:auto;overflow-x:hidden;
  transform:translateY(70px) scale(.985);opacity:0;pointer-events:none;
  transition:transform .6s cubic-bezier(.22,.8,.3,1),opacity .45s ease}
body.detail-open .detail{transform:none;opacity:1;pointer-events:auto}
.home-fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);z-index:950;
  display:flex;align-items:center;gap:12px;background:#fff;border-radius:99px;padding:15px 34px;
  font:900 14px/1 "Zen Maru Gothic","Noto Sans SC";letter-spacing:.14em;
  box-shadow:0 12px 30px rgba(var(--ink-rgb),.22);opacity:0;pointer-events:none;transition:.45s cubic-bezier(.25,.8,.3,1)}
body.detail-open .home-fab{opacity:1;pointer-events:auto;transform:translateX(-50%)}
/* 详情页打开时收起右侧悬浮按钮，避免遮挡内容（手机端尤其明显） */
body.detail-open .music-btn,
body.detail-open .lang-btn,
body.detail-open .day-btn,
body.detail-open .music-panel{opacity:0;pointer-events:none;transform:translateX(18px) scale(.9);transition:opacity .35s,transform .35s}
.home-fab:hover{background:var(--accent);color:#fff}
.home-fab .x{font-size:15px;font-weight:900}

.detail-inner{max-width:760px;margin:0 auto;padding:96px 22px 110px}
.page-head{text-align:center;margin-bottom:16px}
.sign-board{display:inline-block;position:relative;background:var(--ink);border-radius:12px;
  padding:14px 34px;border:3px solid var(--cream);box-shadow:0 8px 20px rgba(var(--ink-rgb),.25);margin-bottom:26px}
.sign-board::before{content:"";position:absolute;inset:5px;border:2px dashed rgba(var(--cream-rgb),.5);border-radius:8px}
.sign-board span{font:900 clamp(16px,3vw,22px)/1 "Zen Maru Gothic";letter-spacing:.3em;color:var(--cream);text-transform:uppercase}
.checker{width:64px;height:12px;margin:0 auto 14px;opacity:.9;
  background:
   conic-gradient(var(--accent) 90deg,transparent 90deg 180deg,var(--accent) 180deg 270deg,transparent 270deg) 0 0/8px 8px,
   conic-gradient(transparent 90deg,var(--accent) 90deg 180deg,transparent 180deg 270deg,var(--accent) 270deg) 4px 4px/8px 8px}
.page-head h1{font:900 clamp(28px,5vw,40px)/1.4 "Zen Maru Gothic","Noto Sans SC";margin:8px 0 4px}
.page-head .sub{color:var(--ink-soft);font-size:13.5px}

.reveal{opacity:0;transform:translateY(24px)}
.reveal.on{opacity:1;transform:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.3,1)}

.msg p{margin-bottom:1.7em;font-size:15px}
.msg .sign{margin-top:2.4em;text-align:right;font-weight:700}
.msg .hl{background:linear-gradient(transparent 62%,rgba(var(--accent-rgb),.35) 62%);font-weight:700}
.edu-band{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--line);
  border-radius:16px;padding:18px 24px;margin:30px 0}
.edu-band .y{font:900 20px/1 "Zen Maru Gothic";color:var(--accent-deep);white-space:nowrap}
.edu-band .arrow{color:var(--accent);font-weight:900}
.edu-band b{font-size:15px}
.edu-band small{display:block;color:var(--ink-soft);font-size:12.5px}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:26px 28px;margin-bottom:24px;transition:.3s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:8px}
.card-head h3{font:700 17.5px/1.5 "Noto Sans SC"}
.card .role{font-size:11.5px;color:#fff;background:var(--accent);border-radius:99px;padding:2px 12px;font-weight:700}
.card .date{font:500 12px/1 "Zen Maru Gothic";color:var(--ink-soft);letter-spacing:.08em}
.card .sub{color:var(--ink-soft);font-size:13px;margin-bottom:12px}
.card ul{list-style:none;margin:6px 0 14px}
.card ul li{position:relative;padding-left:22px;margin-bottom:8px;font-size:13.5px}
.card ul li::before{content:"";position:absolute;left:3px;top:10px;width:8px;height:8px;background:var(--accent);transform:rotate(45deg)}
.works{display:flex;flex-wrap:wrap;gap:8px;border-top:1px dashed var(--line);padding-top:15px}
.works a,.works span{display:inline-flex;align-items:center;gap:6px;font-size:12px;
  border-radius:99px;padding:4px 13px;text-decoration:none;transition:.25s}
.works a{background:var(--accent);color:#fff;border:1.5px solid var(--accent);font-weight:700}
.works a:hover{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;transform:translateY(-2px)}
.works span{background:rgba(var(--ink-rgb),.05);color:var(--ink-soft);border:1.5px dashed var(--line)}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.gallery figure{margin:0;border-radius:12px;overflow:hidden;cursor:zoom-in;position:relative;border:2px solid var(--line);background:#fff}
.gallery img{width:100%;height:150px;object-fit:cover;transition:transform .4s}
.gallery figure:hover img{transform:scale(1.06)}
.gallery figcaption{position:absolute;left:0;right:0;bottom:0;font-size:11px;color:#fff;text-align:center;
  background:linear-gradient(transparent,rgba(var(--ink-rgb),.78));padding:18px 8px 6px}
@media(max-width:620px){.gallery{grid-template-columns:repeat(2,1fr)}.gallery img{height:118px}}

/* ---- 关于我 · 证件照（单独放，圆角矩形） ---- */
.about-portrait{margin:2px 0 10px}
.polaroid{display:inline-block;cursor:zoom-in;border-radius:18px;overflow:hidden;
  border:2px solid var(--line);box-shadow:var(--shadow);background:#fff;
  transition:transform .35s,box-shadow .35s}
.polaroid:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 12px 26px rgba(67,40,26,.28)}
.polaroid img{display:block;width:160px;height:auto}
.polaroid .cap{margin:6px 0 8px;text-align:center;font:700 12px/1.25 "Zen Maru Gothic";color:var(--ink-soft);letter-spacing:.06em}

/* ---- 关于我 · 自拍照片墙 ---- */
.photo-wall{margin:2px 0 14px}
.wall-scroll{position:relative;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  padding:40px 0 46px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;cursor:grab}
.wall-scroll.dragging{cursor:grabbing}
.wall-scroll::-webkit-scrollbar{height:8px}
.wall-scroll::-webkit-scrollbar-track{background:transparent}
.wall-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.wall-scroll::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.wall-track{display:flex;align-items:flex-start;gap:15px;padding:0 26px;width:max-content}
.wall-tile{position:relative;margin:0;height:var(--h);flex:0 0 auto;border-radius:14px;overflow:hidden;
  border:2px solid var(--line);background:#fff;box-shadow:var(--shadow);cursor:zoom-in;
  transform:rotate(var(--r));transform-origin:center top;will-change:transform;
  transition:transform .5s cubic-bezier(.2,.75,.3,1),box-shadow .5s,filter .45s}
.wall-tile img{display:block;height:100%;width:auto;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none;border-radius:11px}
/* 悬停聚光：其余变暗，当前这张放大回正 */
.wall-track:hover .wall-tile{filter:brightness(.76) saturate(.82)}
.wall-track .wall-tile:hover{transform:rotate(0) scale(1.18) translateY(-10px);z-index:6;
  filter:brightness(1) saturate(1);box-shadow:0 20px 40px rgba(67,40,26,.3)}
.wall-hint{text-align:center;font:700 11.5px/1 "Zen Maru Gothic";color:var(--ink-soft);letter-spacing:.22em;margin-top:2px}
.wall-hint::before{content:"↔  ";color:var(--accent)}
@media(max-width:620px){
  .wall-scroll{padding:22px 0 24px}
  .wall-track{gap:11px;padding:0 18px}
  .wall-tile{height:calc(var(--h) * .72)}
  .wall-track .wall-tile:hover{transform:rotate(0) scale(1.1) translateY(-6px)}
  /* 证件照在手机上缩小，避免占满半屏 */
  .polaroid img{width:108px}
  .polaroid .cap{font-size:10.5px;margin:5px 0 7px}
  .about-portrait{margin:0 0 8px}
  /* 详情页顶部留白收紧 */
  .detail-inner{padding:76px 18px 100px}
  /* 首页底部信息卡右侧避让悬浮按钮列，More 不被遮挡 */
  .info-card{right:62px}
}

.skill-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;background:var(--card);
  border:2px solid var(--line);border-radius:16px;padding:18px 24px;margin-bottom:12px;transition:.3s}
.skill-row:hover{transform:translateX(6px);box-shadow:var(--shadow)}
.skill-row b{font-size:14.5px;min-width:150px}
.skill-row b::before{content:"🌴 "}
.skill-row span{color:var(--ink-soft);font-size:13px}
.life-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start}
.life-grid .life-span{grid-column:1/-1}
@media(max-width:620px){.life-grid{grid-template-columns:1fr}}
.life-card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px 22px;transition:.3s}
.life-card:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:var(--shadow)}
.life-card .emoji{font-size:25px}
.life-card b{display:block;margin:7px 0 2px;font-size:14.5px}
.life-card span{color:var(--ink-soft);font-size:12.5px}
.life-card .life-link{display:inline-block;margin-top:9px;color:var(--accent-deep);font-weight:700;font-size:12.5px;text-decoration:none;border-bottom:1.5px solid var(--accent)}
.life-card .life-link:hover{color:var(--accent)}
.life-card .dl-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function workChips(ws){
  if(!ws||!ws.length)return'';
  return `<div class="works">${ws.map(w=>{
    let e='',txt=w,link;
    if(Array.isArray(w)){[e,txt,link]=w;}
    const label=(e?e+' ':'')+esc(txt);
    return link?`<a href="${esc(link)}" target="_blank" rel="noopener">${label}</a>`:`<span>${label}</span>`;
  }).join('')}</div>`;
}
function postShow(ps){
  const L=lang==='en';
  return `<div class="post-show">
    <div class="post-show-head"><b>${L?'Top WeChat Posts · H1 2026':'2026 上半年 · 爆款推文榜单'}</b><span>${L?'Highlight metrics from 138 posts · click a title to read the original · 20-day window':'138 篇推文中的高光数据 · 点击标题可跳转原文 · 20 天阅读口径'}</span></div>
    <div class="post-list">${ps.map((p,i)=>{
      const [t,cat,v,f,l,w,lnk]=p;
      const titleEl=lnk?`<a href="${esc(lnk)}" target="_blank" rel="noopener">${esc(t)}</a>`:esc(t);
      return `<div class="post-item"><span class="post-rank">${i+1}</span><div class="post-body"><div class="post-title">${titleEl}</div><div class="post-meta"><span class="cat">${esc(cat)}</span><span class="m">👁 <b>${v}</b></span><span class="m">🔁 <b>${f}</b></span><span class="m">❤ <b>${l}</b></span><span class="m">👀 <b>${w}</b></span></div></div></div>`;
    }).join('')}</div>
  </div>`;
}

/* ================= 关于我 · 照片墙交互（横滑 + 拖拽） ================= */
(function(){
  const wall=()=>document.getElementById('wallScroll');
  let down=false,startX=0,sl=0,moved=false;
  document.addEventListener('wheel',e=>{
    const w=wall();if(!w||!w.contains(e.target)||!e.deltaY)return;
    w.scrollLeft+=e.deltaY;e.preventDefault();
  },{passive:false});
  document.addEventListener('pointerdown',e=>{
    const w=wall();if(!w||!w.contains(e.target))return;
    down=true;moved=false;startX=e.pageX;sl=w.scrollLeft;
    try{w.setPointerCapture(e.pointerId)}catch(_){}w.classList.add('dragging');
  });
  document.addEventListener('pointermove',e=>{
    if(!down)return;const w=wall();if(!w)return;
    const dx=e.pageX-startX;if(Math.abs(dx)>5)moved=true;
    w.scrollLeft=sl-dx;
  });
  const end=e=>{
    if(!down)return;down=false;const w=wall();
    if(w){w.classList.remove('dragging');try{w.releasePointerCapture(e.pointerId)}catch(_){}}
    if(moved)window.__wallMoved=Date.now();
  };
  document.addEventListener('pointerup',end);
  document.addEventListener('pointercancel',end);
})();

/* 窗户纹理：深色窗框 + 天光反射玻璃 + 十字窗棂（替代原先的纯色大方块） */
const winTexCache={};
function winFor(glass){
  if(winTexCache[glass])return winTexCache[glass];
  const cv=document.createElement('canvas');cv.width=cv.height=128;
  const ctx=cv.getContext('2d');
  const frame='#43281a';
  ctx.fillStyle=frame;ctx.fillRect(0,0,128,128);               // 窗框底
  const ins=12;
  const top=new THREE.Color(glass).lerp(new THREE.Color('#ffffff'),.58);
  const bot=new THREE.Color(glass).lerp(new THREE.Color('#9fb3c8'),.42);
  const grad=ctx.createLinearGradient(0,ins,0,128-ins);
  grad.addColorStop(0,'#'+top.getHexString());
  grad.addColorStop(1,'#'+bot.getHexString());
  ctx.fillStyle=grad;ctx.fillRect(ins,ins,104,104);            // 玻璃
  ctx.fillStyle=frame;
  ctx.fillRect(60,ins,8,104);ctx.fillRect(ins,60,104,8);      // 十字窗棂
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(ins+5,ins+5,44,9); // 玻璃高光
  const tex=new THREE.CanvasTexture(cv);tex.anisotropy=4;
  winTexCache[glass]={texture:tex};
  return winTexCache[glass];
}

const ray=new THREE.Raycaster(),pv=new THREE.Vector2();

function pick(cx2,cy2){
  pv.set(cx2/innerWidth*2-1,-(cy2/innerHeight)*2+1);
  ray.setFromCamera(pv,camera);
  const groups=Object.values(builds).map(b=>b.group).concat(interactables);
  const hits=ray.intersectObjects(groups,true);
  if(!hits.length)return null;
  let o=hits[0].object;while(o&&!o.userData.key)o=o.parent;
  return o||null;
}
function pickSea(cx2,cy2){
  pv.set(cx2/innerWidth*2-1,-(cy2/innerHeight)*2+1);

  const hits=ray.intersectObjects([seaOuter,seaInner],false);

  const p=hits[0].point;

}

function showHoverLabel(k,x,y){

    hoverLabel.textContent=(HOVER_TXT[k][lang]||HOVER_TXT[k].en);
    hoverLabel.style.left=x+'px';
    hoverLabel.style.top=y+'px';
    hoverLabel.classList.add('on');

cv.addEventListener('pointerdown',e=>{dragging=true;moved=false;px=e.clientX;py=e.clientY;cv.classList.add('dragging');cv.setPointerCapture(e.pointerId)});
addEventListener('pointermove',e=>{
  if(dragging){
    const dx=e.clientX-px,dy=e.clientY-py;
    if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
    if(ride&&ride.type!=='return'){
      ride.az+=dx*.006;
      ride.el=Math.min(1.2,Math.max(-.8,ride.el+dy*.005));
    }else{
      cam.tTheta+=dx*.0055;
      cam.tPhi=Math.min(1.35,Math.max(.55,cam.tPhi-dy*.004));
    }
    px=e.clientX;py=e.clientY;
    document.getElementById('dragHint').classList.add('hide');
    hoverLabel.classList.remove('on');
  }else if(!document.body.classList.contains('detail-open')){
    const o=pick(e.clientX,e.clientY);
    const k=o?o.userData.key:null;
    if(k!==hoverKey){
      hoverKey=k;
      cv.classList.toggle('hover-b',!!k);
      if(k&&builds[k])window.__co.setBoard(k);
    }
    showHoverLabel(k,e.clientX,e.clientY);
  }
});
addEventListener('pointerup',e=>{
  cv.classList.remove('dragging');
  if(dragging&&!moved){
    const o=pick(e.clientX,e.clientY);
      if(o){
        if(o.userData.key==='lamp'){toggleLamp(o);sfx('switch');}
        else if(o.userData.key==='ferris'||o.userData.key==='train'){rideRide(o.userData.key);sfx('ride');}

        else if(o.userData.key==='chime'){sfx('bell');addSpark(o.position.x,2.0,o.position.z);showToast(lang==='en'?'Ding～ the sea breeze rings the chime 🎐':'叮铃～海风摇响了风铃 🎐');}
        else if(o.userData.key==='shell'){sfx('shell');addSpark(o.position.x,o.position.y+.3,o.position.z);showToast(lang==='en'?'You found a seashell! 🐚':'捡到一枚小贝壳啦 🐚');}
        else if(o.userData.key==='treasure'){sfx('treasure');addSpark(o.position.x,.9,o.position.z);showToast(lang==='en'?'You found a treasure chest! ✨':'哇，发现一只小宝藏箱！✨');}
        else if(o.userData.key==='bird'){o.userData.dart=1;sfx('bird');showToast(lang==='en'?'Oops, you startled the seagull! 🕊️':'哎呀，把海鸟吓飞啦 🕊️');}
        else if(o.userData.key==='gong'){sfx('gong');addSpark(o.position.x,1.5,o.position.z);showToast(lang==='en'?'Bong～ the lighthouse bell rings 🔔':'铛～灯塔的钟敲响啦 🔔');}
        else if(o.userData.key==='windmill'){o.userData.burst=1;sfx('wind');showToast(lang==='en'?'Wheee～ the windmill spins! 🌀':'呼呼～风车转起来啦 🌀');}
        else if(o.userData.key==='sun'){if(day<=0.5){addBubble(o.position.x,o.position.y,o.position.z);sfx('bubble');showToast(lang==='en'?'The sun blows bubbles ☀️':'太阳咕嘟咕嘟冒泡泡 ☀️');}}
        else{flyTo(o.userData.key);sfx('open',SFX_NOTES[o.userData.key]);}
      }else{
        const sp=pickSea(e.clientX,e.clientY);
        if(sp){addRipple(sp.x,sp.z);addFish(sp.x,sp.z);sfx('sea');}
      }
  }
  dragging=false;
  hoverLabel.classList.remove('on');
});

const HOME={tTheta:.72,tPhi:1.02,tDist:36};
function flyTo(key){
  const b=builds[key];
  const a2=Math.atan2(b.x,b.z);
  const to={theta:a2+Math.PI+.35,phi:1.15,dist:8.5,tgt:new THREE.Vector3(b.x,1.4,b.z)};
  cam.fly={t:0,from:{theta:cam.theta,phi:cam.phi,dist:cam.dist,tgt:cam.tgt.clone()},to};
  cam.tTheta=to.theta;cam.tPhi=to.phi;cam.tDist=to.dist;
  setTimeout(()=>window.__co.openPage(key),680);
}
function flyHome(){
  const to={theta:HOME.tTheta,phi:HOME.tPhi,dist:HOME.tDist,tgt:new THREE.Vector3(0,1.6,0)};
  cam.fly={t:0,from:{theta:cam.theta,phi:cam.phi,dist:cam.dist,tgt:cam.tgt.clone()},to};
  cam.tTheta=to.theta;cam.tPhi=to.phi;cam.tDist=to.dist;
}

/* ===== 摩天轮 / 小火车 骑乘交互 ===== */
let ride=null; // {type:'ferris'|'train'|'return', fromEye, fromLook, look, ktt}
const HOME_TGT=new THREE.Vector3(0,1.6,0);
function showToast(txt){
  let el=document.getElementById('rideToast');
  if(!el){el=document.createElement('div');el.id='rideToast';el.style.cssText='position:fixed;left:50%;top:16%;transform:translateX(-50%) translateY(6px);z-index:9999;background:rgba(var(--ink-rgb),.92);color:#fff;padding:10px 20px;border-radius:99px;font-size:14px;pointer-events:none;transition:opacity .3s,transform .3s;opacity:0;font-family:inherit';document.body.appendChild(el);}
  el.textContent=txt;el.style.opacity=1;el.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity=0;el.style.transform='translateX(-50%) translateY(6px)'},1800);
}
function eyeOf(c){
  return new THREE.Vector3(c.tgt.x+c.dist*Math.sin(c.phi)*Math.sin(c.theta),
                           c.tgt.y+c.dist*Math.cos(c.phi),
                           c.tgt.z+c.dist*Math.sin(c.phi)*Math.cos(c.theta));
}
function ensureRideBack(){
  let el=document.getElementById('rideBack');
  if(!el){el=document.createElement('div');el.id='rideBack';el.style.cssText='position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:9999;background:rgba(244,160,0,.96);color:#43281a;padding:12px 26px;border-radius:99px;font-size:15px;font-weight:600;letter-spacing:.5px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s;font-family:inherit;box-shadow:0 10px 26px rgba(0,0,0,.28)';el.addEventListener('click',endRide);document.body.appendChild(el);}
  return el;
}
function startRide(type){
  ensureRideBack();
  ride={type,fromEye:camera.position.clone(),fromLook:cam.tgt.clone(),look:cam.tgt.clone(),ktt:0,az:0,el:0};
  const el=document.getElementById('rideBack');
  el.textContent=lang==='en'?'Back to the island →':'返回小岛 →';
  el.style.opacity=1;el.style.pointerEvents='auto';
  showToast(type==='train'?(lang==='en'?'Choo choo～ around the island! 🚂':'呜呜～环岛小火车出发啦 🚂'):(lang==='en'?'Wheee～ enjoy the ride! 🎡':'坐稳咯～摩天轮转起来啦 🎡'));
}
function endRide(){
  if(!ride||ride.type==='return')return;
  const prevLook=ride.look.clone();
  ride={type:'return',fromEye:camera.position.clone(),fromLook:prevLook,look:prevLook.clone(),ktt:0};
  const el=document.getElementById('rideBack');
  if(el){el.style.opacity=0;el.style.pointerEvents='none';}
}
function rideRide(which){
  if(ride&&ride.type===which){endRide();return;}
  if(ride)return;
  startRide(which);
}

/* ===== 动画循环 ===== */
let introFired=false;
const clock=new THREE.Clock();
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
(function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  /* 相机 */
  if(cam.fly){
    cam.fly.t+=dt/.85;
    const k=ease(Math.min(1,cam.fly.t));
    const f=cam.fly.from,o=cam.fly.to;
    cam.theta=f.theta+(o.theta-f.theta)*k;
    cam.phi=f.phi+(o.phi-f.phi)*k;
    cam.dist=f.dist+(o.dist-f.dist)*k;
    cam.tgt.lerpVectors(f.tgt,o.tgt,k);
    if(cam.fly.t>=1)cam.fly=null;
  }else{
    cam.theta+=(cam.tTheta-cam.theta)*.09;
    cam.phi+=(cam.tPhi-cam.phi)*.09;
    cam.dist+=(cam.tDist-cam.dist)*.09;
  }
  applyCam();
  /* 昼夜过渡 */
  day+=(dayTarget-day)*.03;
  ambient.intensity=lerp(.6,.25,day);
  hemi.intensity=lerp(.55,.18,day);
  sun.intensity=lerp(1.25,.15,day);
  sun.color.set('#ffffff').lerp(nightSunColor,day);
  ambient.color.set('#fff6e0').lerp(nightAmbColor,day);
  for(const m of nightMats)m.emissiveIntensity=day*.95;
  const isNight=day>.5;
  sunMesh.visible=!isNight;sunGlow.visible=!isNight;moonMesh.visible=isNight;starGroup.visible=isNight;
  sceneEl.style.background=skyGradient(day);
  /* 海鸟绕飞 */
  birds.forEach(bd=>{
    bd.g.userData.dart=Math.max(0,bd.g.userData.dart-dt*1.4);
    bd.g.userData.off+=bd.sp*bd.g.userData.dart*2.6*dt;
    const a=bd.a0+t*bd.sp+bd.g.userData.off;
    bd.g.position.set(Math.cos(a)*bd.r, bd.y+Math.sin(t*2.2+bd.r)*.5, Math.sin(a)*bd.r);
    bd.g.rotation.y=-a;
  });
  /* 摩天轮 */
  wheel.rotation.z+=dt*.32;
  cabins.forEach(c=>c.rotation.z=-wheel.rotation.z);
  /* 夜间烟花：火箭升空 -> 爆发 -> 条纹坠落渐隐 */
  if(isNight){
    fwTimer-=dt;
    if(fwTimer<=0){launchRocket();fwTimer=.9+Math.random()*1.5;}
  }else{
    while(rockets.length){const r=rockets.pop();scene.remove(r.m);scene.remove(r.trail);}
    while(fireworks.length){const f=fireworks.pop();f.streaks.forEach(s=>scene.remove(s.m));if(f.flash)scene.remove(f.flash);}
  }
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];
    r.m.position.y+=r.vy*dt;
    r.trail.position.y=r.m.position.y-.75;
    r.trail.material.opacity=.6*Math.min(1,r.m.position.y/4);
    if(r.m.position.y>=r.burstY){
      scene.remove(r.m);scene.remove(r.trail);
      burstFirework(r);rockets.splice(i,1);
    }
  }
  for(let i=fireworks.length-1;i>=0;i--){
    const f=fireworks[i];f.age+=dt;
    if(f.flash){
      f.flash.scale.setScalar(1+f.age*7);
      f.flash.material.opacity=Math.max(0,1-f.age/.32);
      if(f.age>.32){scene.remove(f.flash);f.flash=null;}
    }
    let alive=false;
    for(const p of f.streaks){
      p.life+=dt;
      const dg=Math.max(0,1-1.2*dt);
      p.vx*=dg; p.vy=p.vy*dg-2.6*dt; p.vz*=dg;
      p.m.position.x+=p.vx*dt; p.m.position.y+=p.vy*dt; p.m.position.z+=p.vz*dt;
      const sp2=p.vx*p.vx+p.vy*p.vy+p.vz*p.vz;
      if(sp2>.02)p.m.lookAt(p.m.position.x+p.vx,p.m.position.y+p.vy,p.m.position.z+p.vz);
      const o=Math.max(0,1-p.life/2);
      p.m.material.opacity=o; p.m.scale.z=Math.max(.06,.9*o);
      if(p.life<2)alive=true;
    }
    if(!alive&&f.age>.4){f.streaks.forEach(s=>scene.remove(s.m));fireworks.splice(i,1);}
  }
  /* 小火车 */
  trainT=(trainT+dt*.016)%1;
  cars.forEach((car,i)=>{
    const tt=(trainT+i*.028)%1;
    const p=curve.getPointAt(tt),p2=curve.getPointAt((tt+.002)%1);
    car.position.set(p.x,0,p.z);
    car.lookAt(p2.x,0,p2.z);
  });
  /* 海水浪花 */
  surf.scale.setScalar(1+Math.sin(t*1.7)*.03);
  surf2.scale.setScalar(1+Math.sin(t*1.7+1.3)*.045);
  waves.forEach((w,i)=>{w.m.scale.setScalar(.75+Math.abs(Math.sin(t*2.2+i*.6))*.5);w.m.position.y=-1.46+Math.sin(t*2.2+i*.6)*.05});
  /* 小帆船缓缓漂动 + 上下浮动 */
  boat.position.y=-1.68+Math.sin(t*1.2)*.14;
  boat.rotation.x=Math.sin(t*.85)*.06;
  boat.rotation.z=Math.sin(t*1.05)*.05;
  boat.position.x=11+Math.sin(t*.22)*1.4;
  boat.position.z=6.5+Math.cos(t*.22)*1.4;
  /* 飞机拖横幅绕岛飞行 */
  planeT=(planeT+dt*.045)%1;
  {
    const pa=planeT*Math.PI*2;
    const pr=13, py=9+Math.sin(pa*2)*.5;
    const px=Math.cos(pa)*pr, pz=Math.sin(pa)*pr;
    const tx=-Math.sin(pa), tz=Math.cos(pa);
    plane.position.set(px,py,pz);
    plane.lookAt(px+tx,py,pz+tz);
    plane.rotation.z+=.34;
    if(plane.userData.prop)plane.userData.prop.rotation.z+=dt*18;
    banner.position.set(px-tx*2.3, py-.15, pz-tz*2.3);
  }
  /* 云 */
  clouds.forEach(c=>{c.g.position.x+=c.v;if(c.g.position.x>14)c.g.position.x=-14});
  /* 飘浮方块 */
  cubes3.forEach(c=>{c.m.position.y=c.y0+Math.sin(t*1.4+c.ph)*.35;c.m.rotation.y+=dt*.6});
  /* 风车转动（点击后加速） */
  wmill.userData.burst=Math.max(0,wmill.userData.burst-dt);
  wblades.rotation.z+=dt*(1+wmill.userData.burst*6);
  /* 海里不时跳起小鱼 */
  fishTimer-=dt;
  if(fishTimer<=0){
    const fa=Math.random()*Math.PI*2, fr=12+Math.random()*4;
    addFish(Math.cos(fa)*fr,Math.sin(fa)*fr);
    fishTimer=2.2+Math.random()*3.5;
  }
  /* 交互特效：涟漪 / 火花 / 小鱼跳跃 / 气泡上升 */
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i];f.t+=dt;
    if(f.type==='ripple'){
      const k=f.t/.7;
      if(k>=1){scene.remove(f.m);fx.splice(i,1);continue;}
      f.m.scale.setScalar(.5+k*4.5);f.m.material.opacity=.8*(1-k);
    }else if(f.type==='spark'){
      f.m.position.x+=f.vx*dt;f.m.position.y+=f.vy*dt;f.m.position.z+=f.vz*dt;f.vy-=2.6*dt;
      f.m.material.opacity=Math.max(0,1-f.t/1.1);
      if(f.t>1.1){scene.remove(f.m);fx.splice(i,1);}
    }else if(f.type==='fish'){
      const k=f.t/.9;
      if(k>=1){addRipple(f.x0+Math.cos(f.dir)*.4,f.z0+Math.sin(f.dir)*.4);scene.remove(f.m);fx.splice(i,1);continue;}
      f.m.position.y=-1.55+Math.sin(k*Math.PI)*1.15;
      f.m.position.x=f.x0+Math.cos(f.dir)*k*.5;
      f.m.position.z=f.z0+Math.sin(f.dir)*k*.5;
      f.m.rotation.y=-f.dir;
    }else{
      f.m.position.x+=f.vx*dt;f.m.position.y+=f.vy*dt;
      f.m.material.opacity=Math.max(0,.7-f.t*.45);
      if(f.t>1.5){scene.remove(f.m);fx.splice(i,1);}
    }
  }
  /* hover 楼浮动（夸张：抬升 + 放大 + 摇摆） */
  for(const [k,b] of Object.entries(builds)){
    const on=(k===hoverKey);
    const tY=on?0.5:0, tS=on?1.16:1;
    b.group.position.y+=(tY-b.group.position.y)*.16;
    const s=b.group.scale.x+(tS-b.group.scale.x)*.16;
    b.group.scale.set(s,s,s);
    const tilt=on?Math.sin(t*6)*.06:0;
    b.group.rotation.z+=(tilt-b.group.rotation.z)*.12;
  }
  /* ===== 骑乘视角：摩天轮吊舱 / 小火车（覆盖相机） ===== */
  if(ride){
    scene.updateMatrixWorld(true);
    const eye=new THREE.Vector3(), look=new THREE.Vector3();
    if(ride.type==='return'){
      const to=eyeOf({theta:HOME.tTheta,phi:HOME.tPhi,dist:HOME.tDist,tgt:HOME_TGT});
      ride.ktt=Math.min(1,ride.ktt+dt/.9); const k=ease(ride.ktt);
      eye.lerpVectors(ride.fromEye,to,k);
      look.lerpVectors(ride.fromLook,HOME_TGT,k);
      if(ride.ktt>=1){
        ride=null;
        cam.theta=HOME.tTheta;cam.phi=HOME.tPhi;cam.dist=HOME.tDist;
        cam.tTheta=cam.theta;cam.tPhi=cam.phi;cam.tDist=cam.dist;
        cam.tgt.copy(HOME_TGT);cam.fly=null;
      }
    }else if(ride.type==='ferris'){
      const cab=new THREE.Vector3();cabins[0].getWorldPosition(cab);
      const hub=new THREE.Vector3();wheel.getWorldPosition(hub);
      const d=new THREE.Vector3().subVectors(cab,hub);d.normalize();
      const eyeT=new THREE.Vector3().copy(cab).addScaledVector(d,.35);eyeT.y+=.35;
      const lookT=new THREE.Vector3(0,3.4,0);
      ride.ktt+=dt; const k=ease(Math.min(1,ride.ktt/1.3));
      eye.lerpVectors(ride.fromEye,eyeT,k);
      look.lerpVectors(ride.fromLook,lookT,k);
    }else if(ride.type==='train'){
      const pos=new THREE.Vector3();cars[0].getWorldPosition(pos);
      const p=curve.getPointAt(trainT),p2=curve.getPointAt((trainT+.004)%1);
      const fwd=new THREE.Vector3(p2.x-p.x,0,p2.z-p.z).normalize();
      const out=new THREE.Vector3(pos.x,0,pos.z).normalize();
      const eyeT=new THREE.Vector3().copy(pos).addScaledVector(fwd,-1.6).addScaledVector(out,.8);eyeT.y+=1.9;
      const lookT=new THREE.Vector3().copy(pos).addScaledVector(fwd,6).addScaledVector(out,-1.8);lookT.y+=.9;
      ride.ktt+=dt; const k=ease(Math.min(1,ride.ktt/1.3));
      eye.lerpVectors(ride.fromEye,eyeT,k);
      look.lerpVectors(ride.fromLook,lookT,k);
    }
    if(ride){
      const dir=new THREE.Vector3().subVectors(look,eye);
      if(ride.az||ride.el){
        const up=new THREE.Vector3(0,1,0);
        dir.applyAxisAngle(up,ride.az);
        const right=new THREE.Vector3().crossVectors(dir,up).normalize();
        dir.applyAxisAngle(right,ride.el);
      }
      look.copy(eye).add(dir);
      ride.look.copy(look);camera.position.copy(eye);camera.lookAt(look);
    }
  }
  renderer.render(scene,camera);
  if(!introFired){introFired=true;if(window.__introsFinish)setTimeout(window.__introsFinish,450)}
})();

  camera.aspect=innerWidth/innerHeight;

/* ===== 点击音效 + 休闲背景音乐（程序化 Web Audio，无需外部音频文件） ===== */
let sfxCtx=null;
function sfxAc(){
  if(!sfxCtx){try{sfxCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(sfxCtx.state==='suspended')sfxCtx.resume();
  return sfxCtx;
}
/* 短音效：sfxBlip(起频,末频,时长,波形,音量,延迟) */
function sfxBlip(f0,f1,dur,type,vol,delay){
  const a=sfxAc(); if(!a)return;
  const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol||0.2,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);
  o.start(t);o.stop(t+dur+0.06);
}
/* 不同点击对象 → 不同音效 */
const PENTA=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25];
const SFX_NOTES={about:0,club:1,proj:2,intern:3,skills:4,life:5,contact:6};
function sfx(kind,note){
  switch(kind){
    case 'open':{                       /* 点开建筑：双音「啵」，不同楼不同音高 */
      const b=PENTA[(note||0)%PENTA.length];
      sfxBlip(b,b,0.12,'sine',0.26); sfxBlip(b*1.5,b*1.5,0.1,'sine',0.16,0.05);
      break;}
    case 'ride':                        /* 上车：明亮三连音 */
      [523.25,659.25,783.99].forEach((f,i)=>sfxBlip(f,f,0.09,'sine',0.2,i*0.07));
      break;
    case 'boat': sfxBlip(600,170,0.2,'sine',0.22); break;   /* 帆船：咕咚下潜 */
    case 'switch': sfxBlip(220,120,0.05,'square',0.12); break; /* 开关：咔哒 */
    case 'tap': sfxBlip(540,380,0.06,'triangle',0.16); break;   /* 普通按钮：轻点 */
    case 'home': sfxBlip(880,440,0.16,'sine',0.2); break;       /* 返回：下滑 */
    case 'sea': sfxBlip(320,150,0.22,'sine',0.2); break;            /* 海面：咕噜水花 */
    case 'bell': sfxBlip(880,860,0.4,'sine',0.18); sfxBlip(1320,1290,0.3,'sine',0.1); break; /* 风铃：叮铃 */
    case 'shell': sfxBlip(1046,1046,0.12,'sine',0.18); break;       /* 捡贝壳：叮 */
    case 'treasure': [523.25,659.25,783.99,1046.5].forEach((f,i)=>sfxBlip(f,f,0.12,'sine',0.18,i*0.08)); break; /* 宝藏：上行琶音 */
    case 'bird': sfxBlip(1200,1700,0.09,'triangle',0.16); sfxBlip(1500,1300,0.07,'triangle',0.12,0.06); break; /* 海鸟：叽喳 */
    case 'gong': sfxBlip(210,195,0.8,'sine',0.28); sfxBlip(315,300,0.5,'sine',0.12,0.02); break; /* 铜钟：铛～ */
    case 'wind': sfxBlip(220,340,0.28,'sine',0.12); break; /* 风车：呼呼 */
    case 'bubble': sfxBlip(500,900,0.14,'sine',0.14); break; /* 泡泡：啵 */
    default: sfxBlip(520,520,0.06,'sine',0.15);
  }
}
window.sfx=sfx; /* 暴露到全局，供经典 <script> 块的 onclick 调用 */
/* 背景音乐 */
const music={on:false,gain:null,timer:null,step:0,vol:0.6};
const CHORDS=[
  [261.63,329.63,392.00,493.88], /* Cmaj7 */
  [220.00,261.63,329.63,392.00], /* Am7 */
  [174.61,220.00,261.63,329.63], /* Fmaj7 */
  [196.00,246.94,293.66,392.00]  /* G */
];
function musicNote(freq,t0,dur,type,vol){
  if(!sfxCtx||!music.gain)return;
  const o=sfxCtx.createOscillator(),g=sfxCtx.createGain();
  o.type=type;o.frequency.value=freq;
  const a=Math.max(0.05,dur*0.35);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+a);
  g.gain.setValueAtTime(vol,t0+dur*0.7);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(music.gain);
  o.start(t0);o.stop(t0+dur+0.08);
}
function musicChunk(){
  if(!sfxCtx)return;
  const t=sfxCtx.currentTime+0.05,bar=4,beat=bar/4;
  const ch=CHORDS[music.step%CHORDS.length];
  ch.forEach(f=>musicNote(f,t,bar*1.15,'sine',0.045));            /* 柔和 pad 和弦 */
  for(let i=0;i<8;i++)musicNote(ch[i%ch.length]*(i%2?2:1),t+i*beat*0.5,beat*0.85,'triangle',0.028); /* 轻盈琶音 */
  music.step++;
}
function startMusic(){
  sfxAc(); if(!sfxCtx)return;
  if(!music.gain){
    music.gain=sfxCtx.createGain();
    music.gain.gain.value=0;
    music.gain.connect(sfxCtx.destination);
  }
  const now=sfxCtx.currentTime;
  music.gain.gain.cancelScheduledValues(now);
  music.gain.gain.setTargetAtTime(music.vol,now,0.6);
  music.step=0;
  musicChunk();
  music.timer=setInterval(musicChunk,4000);
}
function stopMusic(){
  if(music.timer){clearInterval(music.timer);music.timer=null;}
  if(sfxCtx&&music.gain)music.gain.gain.setTargetAtTime(0,sfxCtx.currentTime,0.3);
}
document.getElementById('musicBtn').addEventListener('click',()=>{
  music.on=!music.on;
  const btn=document.getElementById('musicBtn'),panel=document.getElementById('musicPanel');
  if(music.on){
    startMusic();
    btn.classList.add('on');btn.textContent='🎶';
    panel.classList.add('show');
    showToast(lang==='en'?'Relax and enjoy the island 🎶':'来点轻松的小岛音乐 🎶');
  }else{
    stopMusic();
    btn.classList.remove('on');btn.textContent='🎵';
    panel.classList.remove('show');
    showToast(lang==='en'?'Music paused 🔇':'音乐已暂停 🔇');
  }
});
document.getElementById('musicVol').addEventListener('input',e=>{
  music.vol=Number(e.target.value)/100;
  sfxAc();
  if(sfxCtx&&music.gain)music.gain.gain.setTargetAtTime(music.vol,sfxCtx.currentTime,0.1);
});
})();
